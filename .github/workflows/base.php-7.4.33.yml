name: php74-concatfix

on:
  push:
    branches: ["7.4.33-concatfix"]
    paths:
      - "base/php7/**"
      - ".github/workflows/base.php-7.4.33.yml"
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PHP 7.4.33
        uses: docker/build-push-action@v5
        with:
          context: base/php7
          file: base/php7/Dockerfile.7.4.33
          tags: ghcr.io/lzz0403/pctf2025basement/php88:7.4.33-concatfix-apache
          pull: true
          push: true
